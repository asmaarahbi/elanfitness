<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="contact.css">
    <meta property="og:title" content="Élan Fitness | Salle de sport à Casablanca">
    <meta property="og:description" content="Musculation, cardio, yoga et boxe fitness à Casablanca. Découvrez nos activités et réservez votre séance d'essai.">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="fr_FR">
</head>

<body>

    <header class="en-tete">
        <div class="conteneur en-tete-contenu">
            <a href="index.html" class="logo">
                <img src="img/logo.png" alt="Élan Fitness">
            </a>

            <nav>
                <ul class="menu">
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="apropos.html">À propos</a></li>
                    <li><a href="programme.html" class="actif">Programmes</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>

        </div>
    </header>




    <main>


     

        <section class="contact">
            <div class="conteneur-contactus">

                <form>
                    <div class="contacterform">

                        <div class="contacter-nous">
                            <h2>Contactez-nous</h2>
                        </div>

                        <div>
                            <label for="nom">Nom</label>
                            <input type="text" id="nom" name="nom" required>
                        </div>


                        <div>
                            <label for="prenom">Prénom</label>
                            <input type="text" id="prenom" name="prenom" required>
                        </div>

                        <div>
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div>

                            <label for="telephone">Numero de telephone</label>
                            <input type="tel" id="telephone" name="telephone" required>
                        </div>

                        <div>
                            <label for="message">Message</label>
                            <textarea placeholder="Message" required></textarea>
                        </div>

                        <button type="submit" id="bottoncontact">Envoyer</button>

                    </div>
                </form>

            </div>
        </section>















    </main>



    <footer class="pied-de-page">
        <div class="conteneur">

            <div class="pied-haut">
                <div>
                    <p class="logo logo-clair">Élan Fitness</p>
                    <p class="slogan">Ton énergie, ton rythme.</p>
                </div>

                <nav aria-label="Navigation du pied de page">
                    <ul class="menu menu-pied">
                        <li><a href="index.html">Accueil</a></li>
                        <li><a href="apropos.html">À propos</a></li>
                        <li><a href="programme.html">Programmes</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </nav>
            </div>

            <div class="pied-bas">
                <p>Adresse : 12 rue des Palmiers, 20000 Casablanca</p>
                <p>&copy; 2026 Élan Fitness — Projet pédagogique fictif</p>
            </div>

        </div>
    </footer>


</body>

</html>
